name: Deploy Jekyll site to Pages

# 사이트는 파일을 고칠 때마다 바뀌지 않는다 — 매일 밤 23:00(KST) 에 한 번, 그 시각의 main 을
# 검사해 통과한 것만 배포한다(설계 2026-09-13 §3). 급하면 Actions 탭에서 수동 실행한다.
# GitHub 예약 실행은 부하에 따라 수십 분 늦게 돌 수 있다.
# 무료 플랜은 **public** 저장소에만 Pages 를 준다. Settings → Pages → Source 는 "GitHub Actions".

on:
  schedule:
    - cron: '0 14 * * *'   # UTC 14:00 = KST 23:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: jekyll

      - id: pages
        uses: actions/configure-pages@v5

      # baseurl 을 configure-pages 의 base_path 로 덮어쓴다. 사용자 도메인이면 빈 값이다.
      # 팀 개발일지 원본(devlog/devlog.md)을 날짜별 로그로 쪼갠다. 산출물은 커밋하지 않는다.
      - name: 개발일지 반영
        run: python3 scripts/split_devlog.py

      - name: Build with Jekyll
        working-directory: jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: 사이트 검사
        run: python3 scripts/check_site.py --baseurl "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: jekyll/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
