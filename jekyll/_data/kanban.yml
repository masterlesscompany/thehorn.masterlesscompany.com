# 역할별 칸반 — RPG 저장소 기획서 v4(2026-09-09) 기준. v5.2 기능이 아니다.
#
# 역할은 기획서 v4 §3.2 표 그대로다(코어 2 + 위성 3). 카드는 §12 절단선의 "실제 상태"와
# §14.2 구현 현황 · §14.3 미뤄진 것 · §14.4 앞으로 진행 순서에서 옮겼고, 어느 역할에
# 두느냐는 §3.2 "담당 범위" 로 나눴다 — 원문에 카드별 담당자가 적혀 있지는 않다.
#
# col: done(9/9 기준 돌아감) · a(→9/20 A 제출) · b(→10/17 B 데모데이) · hold(보류 · C 이후)
# b 카드의 seq 는 §14.4 표의 순번이다 — 앞 순번이 끝나야 뒤가 시작한다.
# 주의: 키 이름에 `no:` 를 쓰지 않는다(YAML 1.1 → false).

