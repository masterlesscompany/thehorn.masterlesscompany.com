  motions: [Strike, Block]
  weapons:
    - { name: Shield + Short Sword, diff: 막고 빠르게 }
    - { name: Shield + Mace,        diff: 막고 둔탁하게 }
    - { name: Shield + Axe,         diff: 막고 압박 }

