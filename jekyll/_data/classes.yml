    - { name: Long Bow,   diff: 긴 사거리 · 준비 }
    - { name: Combat Bow, diff: 균형 }

- key: bard
  name: Bard
  ko: 음유시인
  role: 지원 — 나팔수 전용이 아니다
  variants: 1
