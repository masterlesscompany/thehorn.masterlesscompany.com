# 클래스 5종 — 기획서 §8(무기 풀) · §49(Combat Variant) · Visual Guide §6.2(Motion Family).
# 클래스는 완성된 직업이 아니라 AI 가 고를 수 있는 행동·무기·전술의 가능 공간이다(§1.3).
# 무기 사이 기본 공격력은 동일하다(§9) — 그래서 `diff` 에는 숫자가 아니라 전술 특성만 쓴다.

- key: warrior
  name: Warrior
  ko: 전사
  role: 근접 압박 — 가장 넓은 무기 공간
  variants: 6
  motions: [Slash, Thrust, Heavy]
  weapons:
    - { name: Long Sword,  diff: 균형 }
    - { name: Short Sword, diff: 빠른 행동 }
    - { name: Hammer,      diff: 방어 돌파 }
    - { name: Axe,         diff: 큰 행동비용 · 압박 }
    - { name: Dual Axe,    diff: 연속 행동 · 방어 불리 }
    - { name: Spear,       diff: Reach }

- key: guardian
  name: Guardian
  ko: 수호자
