{% assign p = site.data.mock_roster | where: "id", "F" | first %}
<figure class="mock" data-mock="creation">
{% include mock/_bar.html scroll="1" t="RECRUITMENT HALL" ko="단원 탄생 · 빈 열 자리 중 여섯째" %}
<div class="mock-scroll"><div class="mock-body wide">
  <ol class="birth">
    <li class="by-dice"><span class="who">주사위</span><b>① Physical</b><span>{{ p.h }}cm · {{ p.body }} · {{ p.w }}kg</span></li>
    <li class="by-dice"><span class="who">주사위</span><b>② Age / Life</b><span>{{ p.age }}세</span></li>
    <li class="by-dice"><span class="who">룰렛</span><b>③ MBTI</b><span>{{ p.mbti }}</span></li>
    <li class="by-user"><span class="who">유저</span><b>④ Gender</b><span>{{ p.g }}</span></li>
    <li class="by-writer"><span class="who">작가</span><b>⑤ 이름 · Life Seed</b><span>{{ p.name }}</span></li>
    <li class="by-user"><span class="who">유저</span><b>⑥ Class · 초기 Stats</b><span>Warrior · AGI 중심</span></li>
    <li class="hands"><span class="who">—</span><b>⑦ HANDS OFF</b><span>유저는 여기서 손을 뗀다</span></li>
    <li class="by-agent"><span class="who">단원</span><b>⑧ Build · Weapon</b><span>AI → {{ p.weapon }}</span></li>
  </ol>
  <div class="birth-card plate">
    {% include emb.html c=p.cls %}
    <div>
      <b style="font-family:var(--serif);font-size:17px;">{{ p.name }}</b> <span class="dim">· {{ p.age }}세 · {{ p.mbti }} · Warrior</span>
      <p style="margin:6px 0 0;font-size:13.5px;color:var(--on-night-2);">“{{ p.seed }}”</p>
      <div class="chipset" style="margin-top:8px;"><span class="code">FAMILY_DUTY</span><span class="code">MONEY_PRESSURE</span><span class="code">RURAL_ORIGIN</span></div>
    </div>
  </div>
</div></div>
<figcaption class="cap">몸과 나이와 성격은 주사위가, 이름과 삶의 이유는 <b>작가</b>가 정한다. 유저는 성별 · Class · 초기 Stats 만 고르고 손을 뗀다. 무기는 단원이 고른다 — 같은 조건에서도 다른 판에서는 다른 합리적 Build 가 나올 수 있다.</figcaption>
</figure>
